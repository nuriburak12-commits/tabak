<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabak: günlük kalori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F1; --surface:#FFFFFF; --ink:#1C2733; --muted:#5E6B74; --line:#DCE3DA; --soft:#E7ECE5;
  --accent:#C2324F; --accent-ink:#FFFFFF;
  --m1:#E1A82E; --m2:#3F8F6B; --m3:#3B5BA9; --m4:#C2324F;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10161D; --surface:#18212B; --ink:#E9EEE8; --muted:#9AA7AE; --line:#27323D; --soft:#1F2A35;
    --accent:#E0506C; --m1:#E9B949; --m2:#55AE86; --m3:#6F8EDB; --m4:#E0506C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10161D; --surface:#18212B; --ink:#E9EEE8; --muted:#9AA7AE; --line:#27323D; --soft:#1F2A35;
  --accent:#E0506C; --m1:#E9B949; --m2:#55AE86; --m3:#6F8EDB; --m4:#E0506C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px 120px}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 4px}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1}
.navbtn:disabled{opacity:.35;cursor:default}
.datetitle{background:none;border:0;text-align:center;padding:4px 8px}
.datetitle b{display:block;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.datetitle span{display:block;color:var(--muted);font-size:13px}

/* plate */
.plate{position:relative;width:min(72vw,270px);aspect-ratio:1;margin:14px auto 6px}
.plate svg{width:100%;height:100%;display:block}
.plate .rim{fill:var(--surface);stroke:var(--line);stroke-width:1}
.plate .track{fill:none;stroke:var(--soft);stroke-width:16}
.plate .seg{fill:none;stroke-width:16;transition:stroke-dasharray .5s ease, stroke-dashoffset .5s ease}
.plate .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.total{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,58px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.unit{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted);margin-top:4px}
.count{font-size:13px;color:var(--muted);margin-top:6px}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.legend div{text-align:center;font-size:12.5px;color:var(--muted)}
.legend b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.hint{text-align:center;color:var(--muted);font-size:14.5px;margin:10px 0 0}

/* meals */
.meal{margin-top:22px}
.mealhead{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--mc)}
.mealhead h2{margin:0;font-family:var(--display);font-weight:700;font-size:19px;flex:1;letter-spacing:-.01em}
.mealhead .mk{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:15px}
.addsmall{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.entries{list-style:none;margin:0;padding:0}
.entries li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.entries .nm{flex:1;min-width:0}
.entries .nm b{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entries .nm span{font-size:13px;color:var(--muted)}
.entries .kc{font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;white-space:nowrap}
.del{width:34px;height:34px;border:0;background:transparent;border-radius:50%;color:var(--muted);font-size:20px;line-height:1;flex:none}
.del:hover{background:var(--soft)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent);display:flex;justify-content:center;z-index:5}
.bigadd{width:100%;max-width:524px;height:56px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px -8px var(--accent)}
.bigadd .plus{font-size:26px;line-height:1;margin-top:-2px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(10,15,20,.45)}
.panel{position:relative;background:var(--surface);border-radius:22px 22px 0 0;height:calc(100% - 28px - env(safe-area-inset-top,0px));max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.view{display:flex;flex-direction:column;flex:1;min-height:0}
.view[hidden]{display:none}
.phead{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.phead h3{margin:0;flex:1;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mealchips .chip[aria-pressed="true"]{background:var(--mc);border-color:var(--mc);color:#fff}
.search{margin:4px 18px 6px;position:relative}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--paper);padding:0 14px 0 42px;font-size:16px}
.search svg{position:absolute;left:14px;top:14px;width:20px;height:20px;color:var(--muted)}
.list{flex:1;overflow-y:auto;padding:0 18px 20px;-webkit-overflow-scrolling:touch}
.food{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line)}
.food .fn{flex:1;min-width:0}
.food .fn b{display:block;font-weight:600;font-size:15.5px}
.food .fn span{font-size:13px;color:var(--muted)}
.food .fk{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap;text-align:right}
.food .fk small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.custombtn{display:block;width:100%;margin:14px 0 4px;padding:14px;border:1.5px dashed var(--line);border-radius:14px;background:none;font-weight:600;color:var(--muted)}
.noresult{color:var(--muted);padding:18px 0 4px;font-size:15px}

/* detail */
.dbody{flex:1;overflow-y:auto;padding:4px 18px 18px}
.dname{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.015em}
.dsub{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.lbl{font-weight:600;font-size:14px;margin:16px 0 8px;color:var(--muted)}
.unitchips{display:flex;flex-wrap:wrap;gap:8px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:24px;font-weight:600}
.qty input{flex:1;min-width:0;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--paper);text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.result{margin-top:24px;padding:18px;border-radius:18px;background:var(--paper);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.result span{color:var(--muted);font-size:14.5px}
.result b{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pfoot{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.primary{width:100%;height:54px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.primary:disabled{opacity:.45}
.field{margin-top:14px}
.field label{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--paper);padding:0 14px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2{display:flex;background:var(--paper);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg2 button{flex:1;border:0;background:none;height:40px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{font-size:13px;color:var(--muted);margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 10px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:15px;z-index:30;max-width:calc(100% - 36px)}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:var(--paper);font-weight:700;text-decoration:underline;padding:6px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="datebar">
    <button class="navbtn" id="prev" aria-label="Önceki gün">‹</button>
    <button class="datetitle" id="today" aria-label="Bugüne dön"><b id="dTitle">Bugün</b><span id="dSub"></span></button>
    <button class="navbtn" id="next" aria-label="Sonraki gün">›</button>
  </div>

  <div class="plate" aria-live="polite">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="rim" cx="100" cy="100" r="98"/>
      <circle class="track" cx="100" cy="100" r="80"/>
      <g id="segs" transform="rotate(-90 100 100)"></g>
    </svg>
    <div class="center">
      <div class="total" id="total">0</div>
      <div class="unit">kcal</div>
      <div class="count" id="count"></div>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <p class="hint" id="hint" hidden>Bugün henüz bir şey eklemedin. Aşağıdaki butonla başlayabilirsin.</p>

  <div id="meals"></div>
</main>

<div class="bottombar">
  <button class="bigadd" id="openAdd"><span class="plus">+</span> Yiyecek veya içecek ekle</button>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo">Geri al</button></div>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

    <!-- list view -->
    <section class="view" id="vList">
      <div class="phead">
        <h3 id="sheetTitle">Ne yedin, ne içtin?</h3>
        <button class="iconbtn" data-close aria-label="Kapat">×</button>
      </div>
      <div class="chips mealchips" id="mealChips"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Ara: simit, ayran, köfte…" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips" id="catChips"></div>
      <div class="list" id="foodList"></div>
    </section>

    <!-- detail view -->
    <section class="view" id="vDetail" hidden>
      <div class="phead">
        <button class="iconbtn" id="backD" aria-label="Listeye dön">‹</button>
        <h3>Miktar</h3>
        <button class="iconbtn" data-close aria-label="Kapat">×</button>
      </div>
      <div class="dbody">
        <div class="dname" id="dName"></div>
        <p class="dsub" id="dInfo"></p>
        <div class="lbl">Ölçü</div>
        <div class="unitchips" id="unitChips"></div>
        <div class="lbl" id="qtyLbl">Adet</div>
        <div class="qty">
          <button id="minus" aria-label="Azalt">−</button>
          <input id="qty" type="number" inputmode="decimal" min="0" step="any" aria-labelledby="qtyLbl">
          <button id="plus" aria-label="Artır">+</button>
        </div>
        <div class="quick" id="quick"></div>
        <div class="result"><span id="resLabel"></span><b id="resKcal">0 kcal</b></div>
        <div class="lbl">Hangi öğün</div>
        <div class="chips mealchips" id="mealChips2" style="padding-left:0;padding-right:0"></div>
      </div>
      <div class="pfoot"><button class="primary" id="addBtn">Ekle</button></div>
    </section>

    <!-- custom view -->
    <section class="view" id="vCustom" hidden>
      <div class="phead">
        <button class="iconbtn" id="backC" aria-label="Listeye dön">‹</button>
        <h3>Kendi ürünün</h3>
        <button class="iconbtn" data-close aria-label="Kapat">×</button>
      </div>
      <div class="dbody">
        <div class="seg2" id="cMode">
          <button aria-pressed="true" data-m="save">Listeye kaydet</button>
          <button aria-pressed="false" data-m="quick">Sadece kalori gir</button>
        </div>
        <div class="field"><label for="cName">Adı</label><input id="cName" placeholder="Örn. annemin kurabiyesi" autocomplete="off"></div>
        <div id="cSaveFields">
          <div class="field"><label>Türü</label>
            <div class="seg2" id="cType"><button aria-pressed="true" data-t="food">Yiyecek (gram)</button><button aria-pressed="false" data-t="drink">İçecek (ml)</button></div>
          </div>
          <div class="field"><label for="cKcal" id="cKcalLbl">100 g için kalori</label><input id="cKcal" type="number" inputmode="decimal" placeholder="Örn. 250"></div>
          <div class="row2">
            <div class="field"><label for="cUnit">Porsiyon adı (isteğe bağlı)</label><input id="cUnit" placeholder="adet, dilim…"></div>
            <div class="field"><label for="cUnitG" id="cUnitGLbl">Kaç gram?</label><input id="cUnitG" type="number" inputmode="decimal" placeholder="Örn. 40"></div>
          </div>
          <p class="note">Kalori bilgisini paketin üzerindeki "100 g için" değerinden alabilirsin. Kaydettiğin ürün listede kalır, sonra yeniden seçebilirsin.</p>
        </div>
        <div id="cQuickFields" hidden>
          <div class="field"><label for="cTotal">Toplam kalori</label><input id="cTotal" type="number" inputmode="decimal" placeholder="Örn. 350"></div>
        </div>
        <div class="lbl">Hangi öğün</div>
        <div class="chips mealchips" id="mealChips3" style="padding-left:0;padding-right:0"></div>
      </div>
      <div class="pfoot"><button class="primary" id="cSave">Kaydet ve devam et</button></div>
    </section>
  </div>
</div>

const BASE=RAW.split("\n").map((l,i)=>{
  const [n,c,k,u]=l.split("|");
  return {id:"b"+i,n,c,k:+k,u:(u||"").split(",").filter(Boolean).map(s=>{const j=s.lastIndexOf(":");return {n:s.slice(0,j),g:+s.slice(j+1)}})};
});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("tr-TR");
const fmtQ=n=>(+n).toLocaleString("tr-TR",{maximumFractionDigits:2});
const norm=s=>s.toLocaleLowerCase("tr").replace(/[çğıöşüâî]/g,ch=>({ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u",â:"a",î:"i"})[ch]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const isDrink=f=>f.c==="icecek"||f.drink;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- storage: local first, synced to your private artifact storage when available ---------- */
const Store=(()=>{
  let db=null,me=null;const chains={};
  const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const ref=key=>key==="meta"?db.doc("data/users/"+me+"/kalori"):db.doc("data/users/"+me+"/kalori/days/"+key);
  async function init(){
    try{
      if(!window.claude||typeof window.claude.use!=="function")return false;
      const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!d||!u)return false;
      const id=await u.id(); if(!id)return false;
      db=d;me=id;return true;
    }catch(e){return false}
  }
  async function remoteGet(key){
    if(!db)return undefined;
    try{const s=await ref(key).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null}catch(e){return undefined}
  }
  function remoteSet(key,val){
    if(!db)return;
    const copy=JSON.parse(JSON.stringify(val));
    chains[key]=(chains[key]||Promise.resolve()).then(()=>ref(key).set(copy)).catch(e=>console.warn("Kayıt hatası",e));
  }
  return {lsGet,lsSet,init,remoteGet,remoteSet,get on(){return !!db}};
})();

/* ---------- state ---------- */
let meta=Store.lsGet("kal:meta")||{custom:[],recent:[]};
meta.custom=meta.custom||[];meta.recent=meta.recent||[];
const days={};
let cur=dkey(new Date());

function getDay(k){
  if(!days[k])days[k]=Store.lsGet("kal:day:"+k)||{entries:[]};
  return days[k];
}
function saveDay(k){Store.lsSet("kal:day:"+k,days[k]);Store.remoteSet(k,days[k])}
function saveMeta(){Store.lsSet("kal:meta",meta);Store.remoteSet("meta",meta)}
function allFoods(){return meta.custom.concat(BASE)}
function findFood(id){return allFoods().find(f=>f.id===id)}

async function syncDay(k){
  const r=await Store.remoteGet(k);
  if(r===undefined)return;
  const local=getDay(k);
  if(r===null){if(local.entries.length)Store.remoteSet(k,local)}
  else{days[k]={entries:Array.isArray(r.entries)?r.entries:[]};Store.lsSet("kal:day:"+k,days[k]);if(k===cur)render()}
}
async function syncMeta(){
  const r=await Store.remoteGet("meta");
  if(r===undefined)return;
  if(r===null){if(meta.custom.length||meta.recent.length)Store.remoteSet("meta",meta)}
  else{meta={custom:r.custom||[],recent:r.recent||[]};Store.lsSet("kal:meta",meta)}
}

/* ---------- main render ---------- */
function render(){
  const d=parseKey(cur),today=dkey(new Date());
  const y=new Date();y.setDate(y.getDate()-1);
  $("#dTitle").textContent=cur===today?"Bugün":cur===dkey(y)?"Dün":d.toLocaleDateString("tr-TR",{weekday:"long"});
  $("#dSub").textContent=d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:cur.slice(0,4)===today.slice(0,4)?undefined:"numeric"});
  $("#next").disabled=cur>=today;

  const day=getDay(cur);
  const per={};MEALS.forEach(m=>per[m.id]=0);
  let total=0;
  day.entries.forEach(e=>{per[e.meal]=(per[e.meal]||0)+e.kcal;total+=e.kcal});
  $("#total").textContent=fmt(total);
  $("#count").textContent=day.entries.length?day.entries.length+" kayıt":"";
  $("#hint").hidden=!!day.entries.length;
  $("#hint").textContent=cur===today?"Bugün henüz bir şey eklemedin. Aşağıdaki butonla başlayabilirsin.":"Bu gün için kayıt yok.";

  // plate segments
  const R=80,C=2*Math.PI*R,gap=total>0&&MEALS.filter(m=>per[m.id]>0).length>1?3:0;
  let off=0,svg="";
  MEALS.forEach(m=>{
    const v=per[m.id];if(!v||!total)return;
    const len=Math.max(v/total*C-gap,1);
    svg+=`<circle class="seg" cx="100" cy="100" r="${R}" style="stroke:${m.c}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;
    off+=v/total*C;
  });
  $("#segs").innerHTML=svg;

  $("#legend").innerHTML=MEALS.map(m=>`<div><b>${fmt(per[m.id])}</b><i style="background:${m.c}"></i>${m.short}</div>`).join("");

  $("#meals").innerHTML=MEALS.map(m=>{
    const list=day.entries.filter(e=>e.meal===m.id);
    return `<section class="meal" style="--mc:${m.c}">
      <div class="mealhead"><h2>${m.name}</h2><span class="mk">${per[m.id]?fmt(per[m.id])+" kcal":""}</span>
      <button class="addsmall" data-add="${m.id}" aria-label="${m.name} için ekle">+ Ekle</button></div>
      ${list.length?`<ul class="entries">${list.map(e=>`<li><div class="nm"><b>${esc(e.name)}</b><span>${esc(e.amount)}</span></div><span class="kc">${fmt(e.kcal)} kcal</span><button class="del" data-del="${e.id}" aria-label="${esc(e.name)} sil">×</button></li>`).join("")}</ul>`:`<div class="empty">Henüz bir şey yok.</div>`}
    </section>`;
  }).join("");
}

/* ---------- date nav ---------- */
function shift(n){const d=parseKey(cur);d.setDate(d.getDate()+n);const k=dkey(d);if(k>dkey(new Date()))return;cur=k;render();syncDay(k)}
$("#prev").onclick=()=>shift(-1);
$("#next").onclick=()=>shift(1);
$("#today").onclick=()=>{cur=dkey(new Date());render();syncDay(cur)};

/* ---------- delete + undo ---------- */
let undoData=null,toastT=null;
$("#meals").addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a){openSheet(a.dataset.add);return}
  const d=e.target.closest("[data-del]");if(!d)return;
  const day=getDay(cur),i=day.entries.findIndex(x=>x.id===d.dataset.del);if(i<0)return;
  const [rm]=day.entries.splice(i,1);saveDay(cur);render();
  undoData={k:cur,i,e:rm};toast(esc(rm.name)+" silindi",true);
});
$("#undo").onclick=()=>{
  if(!undoData)return;const day=getDay(undoData.k);day.entries.splice(undoData.i,0,undoData.e);saveDay(undoData.k);undoData=null;$("#toast").hidden=true;render();
};
function toast(msg,undo){
  $("#toastMsg").innerHTML=msg;$("#undo").hidden=!undo;$("#toast").hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{$("#toast").hidden=true;undoData=null},4000);
}

/* ---------- sheet ---------- */
let selMeal="kahvalti",selCat="all",selFood=null,selUnit=null;
function guessMeal(){const h=new Date().getHours();return h<11?"kahvalti":h<16?"ogle":h<21?"aksam":"ara"}
function mealChipsHTML(){return MEALS.map(m=>`<button class="chip" style="--mc:${m.c}" data-meal="${m.id}" aria-pressed="${m.id===selMeal}">${m.short}</button>`).join("")}
function paintMealChips(){["#mealChips","#mealChips2","#mealChips3"].forEach(s=>$(s).innerHTML=mealChipsHTML())}
document.querySelectorAll(".mealchips").forEach(el=>el.addEventListener("click",e=>{const b=e.target.closest("[data-meal]");if(!b)return;selMeal=b.dataset.meal;paintMealChips()}));

function openSheet(meal){
  selMeal=meal||guessMeal();selCat=meta.recent.length?"recent":"all";
  $("#q").value="";paintMealChips();paintCats();paintList();show("vList");
  $("#sheet").hidden=false;document.body.style.overflow="hidden";
}
function closeSheet(){$("#sheet").hidden=true;document.body.style.overflow=""}
function show(id){["vList","vDetail","vCustom"].forEach(v=>$("#"+v).hidden=v!==id)}
$("#openAdd").onclick=()=>openSheet();
$("#backdrop").onclick=closeSheet;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});

function paintCats(){
  const opts=[["all","Hepsi"]];
  if(meta.recent.length)opts.unshift(["recent","Son kullanılanlar"]);
  if(meta.custom.length)opts.push(["mine","Benim ürünlerim"]);
  $("#catChips").innerHTML=opts.concat(CATS).map(([k,n])=>`<button class="chip" data-cat="${k}" aria-pressed="${k===selCat}">${n}</button>`).join("");
}
$("#catChips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;selCat=b.dataset.cat;paintCats();paintList();$("#foodList").scrollTop=0});
$("#q").addEventListener("input",paintList);

function foodRow(f){
  const unit=isDrink(f)?"ml":"g",u=f.u&&f.u[0];
  const sub=u?`1 ${u.n} (${fmtQ(u.g)} ${unit}) ≈ ${fmt(f.k*u.g/100)} kcal`:`100 ${unit} = ${fmt(f.k)} kcal`;
  return `<button class="food" data-food="${f.id}"><div class="fn"><b>${esc(f.n)}</b><span>${esc(sub)}</span></div><div class="fk">${fmt(f.k)}<small>kcal/100 ${unit}</small></div></button>`;
}
function paintList(){
  const q=norm($("#q").value.trim());
  let list;
  if(q){
    const words=q.split(/\s+/);
    list=allFoods().filter(f=>{const n=norm(f.n);return words.every(w=>n.includes(w))})
      .sort((a,b)=>(norm(b.n).startsWith(q)?1:0)-(norm(a.n).startsWith(q)?1:0));
  }else if(selCat==="recent"){list=meta.recent.map(findFood).filter(Boolean)}
  else if(selCat==="mine"){list=meta.custom.slice()}
  else if(selCat==="all"){list=allFoods().slice().sort((a,b)=>a.n.localeCompare(b.n,"tr"))}
  else list=allFoods().filter(f=>f.c===selCat);
  let html=list.map(foodRow).join("");
  if(!list.length)html=`<p class="noresult">${q?"\""+esc($("#q").value.trim())+"\" listede yok. Kendi ürünün olarak ekleyebilirsin.":"Bu bölümde ürün yok."}</p>`;
  html+=`<button class="custombtn" id="toCustom">+ Listede yok mu? Kendi ürününü ekle</button>`;
  $("#foodList").innerHTML=html;
}
$("#foodList").addEventListener("click",e=>{
  if(e.target.closest("#toCustom")){openCustom();return}
  const b=e.target.closest("[data-food]");if(b)openDetail(findFood(b.dataset.food));
});

/* ---------- detail ---------- */
function openDetail(f){
  if(!f)return;selFood=f;
  selUnit=f.u&&f.u.length?0:-1;
  $("#dName").textContent=f.n;
  const unit=isDrink(f)?"ml":"g";
  $("#dInfo").textContent=`100 ${unit} = ${fmt(f.k)} kcal`;
  paintUnits();setQtyDefault();calc();paintMealChips();show("vDetail");
  $("#vDetail .dbody").scrollTop=0;
}
function paintUnits(){
  const f=selFood,unit=isDrink(f)?"ml":"g";
  const opts=(f.u||[]).map((u,i)=>`<button class="chip" data-u="${i}" aria-pressed="${selUnit===i}">${esc(u.n)} <span style="opacity:.7;font-weight:500">${fmtQ(u.g)} ${unit}</span></button>`);
  opts.push(`<button class="chip" data-u="-1" aria-pressed="${selUnit===-1}">${isDrink(f)?"Mililitre":"Gram"}</button>`);
  $("#unitChips").innerHTML=opts.join("");
  const quick=selUnit===-1?(isDrink(f)?[100,200,250,330,500]:[50,100,150,200,250]):[0.5,1,2,3];
  $("#quick").innerHTML=quick.map(q=>`<button class="chip" data-q="${q}">${fmtQ(q)}${selUnit===-1?" "+unit:""}</button>`).join("");
  $("#qtyLbl").textContent=selUnit===-1?(isDrink(f)?"Kaç ml?":"Kaç gram?"):"Kaç "+f.u[selUnit].n+"?";
}
function setQtyDefault(){$("#qty").value=selUnit===-1?(isDrink(selFood)?200:100):1}
$("#unitChips").addEventListener("click",e=>{const b=e.target.closest("[data-u]");if(!b)return;selUnit=+b.dataset.u;paintUnits();setQtyDefault();calc()});
$("#quick").addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(!b)return;$("#qty").value=b.dataset.q;calc()});
function step(dir){
  const s=selUnit===-1?(isDrink(selFood)?50:10):0.5;
  let v=parseFloat(String($("#qty").value).replace(",","."))||0;
  v=Math.max(0,Math.round((v+dir*s)/s)*s);$("#qty").value=v;calc();
}
$("#minus").onclick=()=>step(-1);$("#plus").onclick=()=>step(1);
$("#qty").addEventListener("input",calc);
function grams(){
  const v=parseFloat(String($("#qty").value).replace(",","."))||0;
  return selUnit===-1?v:v*selFood.u[selUnit].g;
}
function amountText(){
  const v=parseFloat(String($("#qty").value).replace(",","."))||0,unit=isDrink(selFood)?"ml":"g";
  return selUnit===-1?`${fmtQ(v)} ${unit}`:`${fmtQ(v)} ${selFood.u[selUnit].n} (${fmtQ(grams())} ${unit})`;
}
function calc(){
  const g=grams(),k=selFood.k*g/100;
  $("#resLabel").textContent=amountText();
  $("#resKcal").textContent=fmt(k)+" kcal";
  $("#addBtn").disabled=!(g>0);
}
function addEntry(name,amount,kcal,foodId){
  const day=getDay(cur);
  day.entries.push({id:uid(),name,amount,kcal:Math.round(kcal),meal:selMeal,t:Date.now()});
  saveDay(cur);
  if(foodId){meta.recent=[foodId].concat(meta.recent.filter(x=>x!==foodId)).slice(0,25);saveMeta()}
  render();
  const m=MEALS.find(x=>x.id===selMeal);
  closeSheet();toast(esc(name)+" "+m.short.toLocaleLowerCase("tr")+" listesine eklendi",false);
}
$("#addBtn").onclick=()=>{const g=grams();if(!(g>0))return;addEntry(selFood.n,amountText(),selFood.k*g/100,selFood.id)};
$("#backD").onclick=()=>{paintCats();paintList();show("vList")};

/* ---------- custom ---------- */
let cMode="save",cType="food";
function openCustom(){
  const q=$("#q").value.trim();
  $("#cName").value=q;$("#cKcal").value="";$("#cUnit").value="";$("#cUnitG").value="";$("#cTotal").value="";
  setCMode("save");setCType("food");paintMealChips();show("vCustom");
}
function setCMode(m){cMode=m;document.querySelectorAll("#cMode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));$("#cSaveFields").hidden=m!=="save";$("#cQuickFields").hidden=m!=="quick";$("#cSave").textContent=m==="save"?"Kaydet ve miktar seç":"Ekle"}
function setCType(t){cType=t;document.querySelectorAll("#cType button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));$("#cKcalLbl").textContent=t==="drink"?"100 ml için kalori":"100 g için kalori";$("#cUnitGLbl").textContent=t==="drink"?"Kaç ml?":"Kaç gram?"}
$("#cMode").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)setCMode(b.dataset.m)});
$("#cType").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)setCType(b.dataset.t)});
$("#backC").onclick=()=>{paintCats();paintList();show("vList")};
const num=s=>parseFloat(String(s).replace(",","."));
$("#cSave").onclick=()=>{
  const name=$("#cName").value.trim();
  if(!name){$("#cName").focus();toast("Önce bir ad yaz.",false);return}
  if(cMode==="quick"){
    const k=num($("#cTotal").value);if(!(k>=0)||$("#cTotal").value===""){$("#cTotal").focus();toast("Toplam kaloriyi yaz.",false);return}
    addEntry(name,"elle girildi",k,null);return;
  }
  const k=num($("#cKcal").value);
  if(!(k>=0)||$("#cKcal").value===""){$("#cKcal").focus();toast("100 g için kaloriyi yaz.",false);return}
  const f={id:"c"+uid(),n:name,c:cType==="drink"?"icecek":"mine",drink:cType==="drink",k,u:[]};
  const un=$("#cUnit").value.trim(),ug=num($("#cUnitG").value);
  if(un&&ug>0)f.u.push({n:un,g:ug});
  meta.custom.unshift(f);saveMeta();openDetail(f);
};

/* ---------- boot ---------- */
render();
Store.init().then(ok=>{if(!ok)return;syncMeta();syncDay(cur)});
})();
</script>
</body>
